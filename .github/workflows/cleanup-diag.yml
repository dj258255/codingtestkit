name: Cleanup diag uploads

# 승인 대기 중인 1.7.0(update 1104811, Rust 게이트 수정 전 빌드) 삭제 후
# 수정본을 재업로드하기 위한 일회용 워크플로 — 실행 후 파일 삭제.
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete pending 1.7.0 (update 1104811)
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o resp.json -w "%{http_code}" \
            -X DELETE "https://plugins.jetbrains.com/api/updates/1104811" \
            -H "Authorization: Bearer $PUBLISH_TOKEN")
          echo "delete 1104811 → HTTP $HTTP_CODE"
          cat resp.json || true
