name: Cleanup diag uploads

# 승인 대기 중인 1.7.0(update 1104817, API 경고 제거 전 빌드) 삭제용 일회용 워크플로.
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete pending 1.7.0 (update 1104817)
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o resp.json -w "%{http_code}" \
            -X DELETE "https://plugins.jetbrains.com/api/updates/1104817" \
            -H "Authorization: Bearer $PUBLISH_TOKEN")
          echo "delete 1104817 → HTTP $HTTP_CODE"
          cat resp.json || true
