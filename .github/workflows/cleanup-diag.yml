name: Cleanup diag uploads

# 진단 때 'default'라는 이름의 채널에 중복 등록된 1.6.1 삭제 (일회용 — 실행 후 파일 삭제).
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete duplicate 1.6.1 (update 1104792)
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o resp.json -w "%{http_code}" \
            -X DELETE "https://plugins.jetbrains.com/api/updates/1104792" \
            -H "Authorization: Bearer $PUBLISH_TOKEN")
          echo "delete 1104792 → HTTP $HTTP_CODE"
          cat resp.json || true
