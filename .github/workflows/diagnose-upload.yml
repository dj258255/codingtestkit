name: Diagnose Marketplace Upload

# 1.7.0 업로드 500 원인 이진 탐색 (임시 진단용 — 원인 확정 후 삭제).
# 변형 zip 3종을 diag 채널로 업로드해 어느 요소가 서버 500을 유발하는지 가른다.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Make variants and upload each
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import glob, io, os, re, shutil, zipfile

          base = glob.glob('build/distributions/CodingTestKit-*.zip')[0]

          def patch_zip(src_zip, dst_zip, version, drop_module_jars=False,
                        strip_changenotes=False, strip_optional_depends=False,
                        replacements=None):
              with zipfile.ZipFile(src_zip) as zin:
                  names = zin.namelist()
                  with zipfile.ZipFile(dst_zip, 'w', zipfile.ZIP_DEFLATED) as zout:
                      for n in names:
                          data = zin.read(n)
                          if drop_module_jars and re.search(r'lib/CodingTestKit\.(core|debugger-[a-z]+)\.jar$', n):
                              continue  # 모듈 jar 제외
                          if n.endswith('lib/' + os.path.basename(base).replace('.zip', '.jar')) or re.search(r'lib/CodingTestKit-[0-9.]+\.jar$', n):
                              data = patch_main_jar(data, version, strip_changenotes, strip_optional_depends, replacements)
                          zout.writestr(n, data)

          def patch_main_jar(jar_bytes, version, strip_changenotes, strip_optional_depends, replacements=None):
              src = io.BytesIO(jar_bytes)
              out = io.BytesIO()
              with zipfile.ZipFile(src) as jin, zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as jout:
                  for n in jin.namelist():
                      data = jin.read(n)
                      if n == 'META-INF/plugin.xml':
                          xml = data.decode('utf-8')
                          xml = xml.replace('<version>1.7.0</version>', f'<version>{version}</version>')
                          if strip_changenotes:
                              xml = re.sub(r'<change-notes>.*?</change-notes>',
                                           '<change-notes><![CDATA[<p>Diagnostic build - plain ASCII change notes only.</p>]]></change-notes>',
                                           xml, flags=re.S)
                          if strip_optional_depends:
                              xml = re.sub(r'\n\s*<depends optional="true"[^>]*>[^<]*</depends>', '', xml)
                          for old, new in (replacements or []):
                              xml = xml.replace(old, new)
                          data = xml.encode('utf-8')
                      jout.writestr(n, data)
              return out.getvalue()

          variants = [
              # 라운드 2: change-notes 내 정확한 유발 문자열 짚기 (전체 노트 유지, 한 요소만 치환)
              ('d-no-braces', dict(replacements=[('{{SOLUTION}}', 'SOLUTION')])),
              ('e-no-arrow',  dict(replacements=[('⤢', 'maximize')])),
              ('f-ascii-sym', dict(replacements=[('★', '*'), ('–', '-'), ('…', '...')])),
          ]
          os.makedirs('variants', exist_ok=True)
          for tag, kw in variants:
              dst = f'variants/{tag}.zip'
              patch_zip(base, dst, f'1.7.0-diag-{tag}', **kw)
              print('built', dst, os.path.getsize(dst))
          EOF

          for v in variants/*.zip; do
            TAG=$(basename "$v" .zip)
            HTTP_CODE=$(curl -s -o "resp-$TAG.json" -w "%{http_code}" \
              -X POST "https://plugins.jetbrains.com/plugin/uploadPlugin" \
              -H "Authorization: Bearer $PUBLISH_TOKEN" \
              -F "xmlId=com.codingtestkit" \
              -F "channel=diag" \
              -F "file=@$v")
            echo "==== VARIANT $TAG → HTTP $HTTP_CODE"
            cat "resp-$TAG.json" || true
            echo
          done
