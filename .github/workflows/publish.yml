name: Publish Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 주의: change-notes가 과도하게 길면 마켓플레이스가 500으로 업로드를 거부한다
      # (v1.7.0 릴리스 때 확인). plugin.xml에는 최근 1-2개 버전의 노트만 유지할 것.
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin
