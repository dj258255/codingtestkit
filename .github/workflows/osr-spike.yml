name: OSR Spike (Linux JCEF probe)

# 진단용 스파이크. GitHub Actions ubuntu(Xvfb)에서 JCEF가 초기화되고
# OSR로 rAF/추출이 되는지 확인만 한다. 수동 실행 또는 스파이크 브랜치 푸시로만 동작.
on:
  workflow_dispatch:
  push:
    branches:
      - "spike/osr-ci"

jobs:
  osr-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run OSR spike under Xvfb
        env:
          CTK_OSR_SPIKE: "true"
        # xvfb-run 으로 가짜 디스플레이 제공 → JCEF가 렌더링 가능
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" ./gradlew test --tests "com.codingtestkit.service.JcefOsrSpikeTest" --info 2>&1 | grep -E "OSR-SPIKE|BUILD|FAIL" || true

      - name: Upload full test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osr-spike-report
          path: build/reports/tests/
